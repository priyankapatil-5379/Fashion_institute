<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | The Fashion Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --theme-main: #ed1275;
            --theme-accent: #ff6b35;
        }
        body {
            background: #fdf2e9;
            min-height: 100vh;
            overflow-x: hidden;
            display: block; /* Override default flex from original */
            padding: 0;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
        }
        .login-side-image {
            width: 40%;
            background: url('/images/register_photo_side.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .login-side-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(237, 18, 117, 0.1), rgba(255, 107, 53, 0.1));
        }
        .login-form-side {
            width: 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            background: white;
        }
        .auth-card {
            width: 100%;
            max-width: 700px;
        }
        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: #2b1b10;
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.75rem 1.2rem;
            border: 1.5px solid #eee;
            background: #fafafa;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            background: white;
            border-color: var(--theme-main);
            box-shadow: 0 0 0 4px rgba(237, 18, 117, 0.1);
        }
        .btn-auth {
            background: linear-gradient(90deg, var(--theme-main) 0%, var(--theme-accent) 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(237, 18, 117, 0.2);
        }
        .btn-auth:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(237, 18, 117, 0.3);
            color: white;
        }

        @media (max-width: 991px) {
            .login-wrapper { flex-direction: column !important; }
            .login-side-image { 
                display: block !important; 
                width: 100% !important; 
                height: 200px !important; 
                order: 1;
            }
            .login-form-side { 
                width: 100% !important; 
                padding: 2rem 1.5rem !important; 
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left Side: Image -->
        <div class="login-side-image">
            <div class="position-absolute bottom-0 left-0 p-5 text-white w-100" style="z-index: 2; background: linear-gradient(transparent, rgba(0,0,0,0.7));">
                <h3 class="fw-bold mb-2"></h3>
                <p class="small opacity-75"></p>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="login-form-side">
            <div class="auth-card">
                <div class="auth-header text-center mb-5">
                    <h2 class="mb-2">Create Account</h2>
                    <p class="text-muted small">Enter your details to join the elite fashion & photography community.</p>
                </div>
                
                <form th:action="@{/register}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-dark">Full Name</label>
                        <input type="text" name="fullName" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Confirm Password</label>
                            <input type="password" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Date of Birth</label>
                            <input type="date" name="dob" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Gender</label>
                            <select name="gender" class="form-select" required>
                                <option value="" selected disabled>Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Register As</label>
                            <select name="role" class="form-select" required>
                                <option value="STUDENT" selected>Student / Learner</option>
                                <option value="VENDOR">College / Instructor</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small fw-bold text-dark">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">+91</span>
                                <input type="tel" name="phone" class="form-control" style="border-radius: 0 12px 12px 0;" placeholder="9876543210" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">I agree to the <a href="#" style="color: var(--theme-main); font-weight: 600; text-decoration: none;">Terms & Conditions</a></label>
                    </div>
                    <button type="submit" class="btn-auth mb-4 shadow">REGISTER NOW <i class="fa-solid fa-user-plus ms-2"></i></button>
                </form>
                
                <div class="auth-footer text-center small mt-4 pt-4 border-top">
                    Already have an account? <a th:href="@{/?login=true}" style="color: var(--theme-main); text-decoration: none; font-weight: 700;">Login Here</a>
                    <div class="mt-3">
                        <a th:href="@{/}" class="text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
</body>
</html>
