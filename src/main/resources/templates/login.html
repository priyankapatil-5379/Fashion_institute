<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Fashion Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --theme-main: #ed1275;
            --theme-accent: #ff6b35;
        }
        body {
            background: #fdf2e9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
        }
        .login-side-image {
            width: 50%;
            background: url('/images/login_lehenga_side.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .login-side-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(237, 18, 117, 0.1), rgba(255, 107, 53, 0.1));
        }
        .login-form-side {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            background: white;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
        }
        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: #2b1b10;
        }
        .form-control {
            border-radius: 15px;
            padding: 0.9rem 1.2rem;
            border: 1.5px solid #eee;
            background: #fafafa;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: white;
            border-color: var(--theme-main);
            box-shadow: 0 0 0 4px rgba(237, 18, 117, 0.1);
        }
        .btn-auth {
            background: linear-gradient(90deg, var(--theme-main) 0%, var(--theme-accent) 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 15px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(237, 18, 117, 0.2);
        }
        .btn-auth:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(237, 18, 117, 0.3);
            color: white;
        }
        .input-group-text {
            background: #fafafa;
            border: 1.5px solid #eee;
            border-right: none;
            border-radius: 15px 0 0 15px;
            color: #999;
        }
        .form-control {
            border-left: none;
            border-radius: 0 15px 15px 0;
        }

        @media (max-width: 991px) {
            .login-wrapper { flex-direction: column !important; }
            .login-side-image { 
                display: block !important; 
                width: 100% !important; 
                height: 250px !important; 
                order: 1;
            }
            .login-form-side { 
                width: 100% !important; 
                padding: 2rem 1.5rem !important; 
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left Side: Image -->
        <div class="login-side-image">
            <div class="position-absolute bottom-0 left-0 p-5 text-white w-100" style="z-index: 2; background: linear-gradient(transparent, rgba(0,0,0,0.7));">
                <h3 class="fw-bold mb-2"></h3>
                <p class="small opacity-75"></p>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="login-form-side">
            <div class="auth-card">
                <div class="auth-header text-center mb-5">
                    <!-- Error Alert -->
                    <div th:if="${param.error}" class="alert alert-danger border-0 rounded-4 mb-4 small text-start shadow-sm">
                        <i class="fa-solid fa-circle-exclamation me-2"></i> Invalid username or password.
                    </div>
                    <!-- Logout Alert -->
                    <div th:if="${param.logout}" class="alert alert-info border-0 rounded-4 mb-4 small text-start shadow-sm">
                        <i class="fa-solid fa-circle-info me-2"></i> You have been logged out.
                    </div>
                    
                    <h2 class="mb-2">Welcome Back</h2>
                    <p class="text-muted small">Access your fashion institute portal with your credentials.</p>
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-dark">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mb-4 small">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label text-muted" for="remember">Remember me</label>
                        </div>
                        <a th:href="@{/forgot-password}" style="color: var(--theme-main); text-decoration: none; font-weight: 600;">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-auth mb-4 shadow">SIGN IN <i class="fa-solid fa-right-to-bracket ms-2"></i></button>
                </form>
                
                <div class="auth-footer text-center small mt-4 pt-4 border-top">
                    Don't have an account? <a th:href="@{/register}" style="color: var(--theme-main); text-decoration: none; font-weight: 700;">Register Now</a>
                    <div class="mt-3">
                        <a th:href="@{/}" class="text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
</body>
</html>
