<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | The Fashion Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --theme-main: #ed1275;
            --theme-accent: #ff6b35;
        }
        body {
            background: #fdf2e9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
        }
        .login-side-image {
            width: 50%;
            background: url('/images/forgot_password_side.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .login-side-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.2), rgba(237, 18, 117, 0.1));
        }
        .login-form-side {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            background: white;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
        }
        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: #2b1b10;
        }
        .form-control {
            border-radius: 15px;
            padding: 0.9rem 1.2rem;
            border: 1.5px solid #eee;
            background: #fafafa;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: white;
            border-color: var(--theme-main);
            box-shadow: 0 0 0 4px rgba(237, 18, 117, 0.1);
        }
        .btn-auth {
            background: linear-gradient(90deg, var(--theme-main) 0%, var(--theme-accent) 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 15px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(237, 18, 117, 0.2);
        }
        .btn-auth:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(237, 18, 117, 0.3);
            color: white;
        }
        .input-group-text {
            background: #fafafa;
            border: 1.5px solid #eee;
            border-right: none;
            border-radius: 15px 0 0 15px;
            color: #999;
        }
        .form-control {
            border-left: none;
            border-radius: 0 15px 15px 0;
        }

        @media (max-width: 991px) {
            .login-wrapper { flex-direction: column !important; }
            .login-side-image { 
                display: block !important; 
                width: 100% !important; 
                height: 250px !important; 
                order: 1;
            }
            .login-form-side { 
                width: 100% !important; 
                padding: 2rem 1.5rem !important; 
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left Side: Image -->
        <div class="login-side-image">
            <div class="position-absolute bottom-0 left-0 p-5 text-white w-100" style="z-index: 2; background: linear-gradient(transparent, rgba(0,0,0,0.7));">
                <h3 class="fw-bold mb-2"></h3>
                <p class="small opacity-75"></p>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="login-form-side">
            <div class="auth-card">
                <div class="auth-header text-center mb-5">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle" style="width: 80px; height: 80px;">
                            <i class="fa-solid fa-key fa-2x" style="color: var(--theme-main);"></i>
                        </div>
                    </div>
                    <h2 class="mb-2">Reset Password</h2>
                    <p id="stepDescription" class="text-muted small">Enter your email and we'll send you an OTP to reset your password.</p>
                </div>

                <!-- Step 1: Email -->
                <div id="stepEmail">
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" id="emailInput" class="form-control" placeholder="name@example.com">
                        </div>
                    </div>
                    <button type="button" onclick="requestOtp()" class="btn-auth mb-4 shadow">SEND OTP <i class="fa-solid fa-paper-plane ms-2"></i></button>
                </div>

                <!-- Step 2: OTP -->
                <div id="stepOtp" style="display: none;">
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Enter 6-Digit OTP</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                            <input type="text" id="otpInput" class="form-control" placeholder="000000" maxlength="6">
                        </div>
                        <small class="text-muted mt-2 d-block">Please check your email for the verification code.</small>
                    </div>
                    <button type="button" onclick="verifyOtp()" class="btn-auth mb-4 shadow">VERIFY OTP <i class="fa-solid fa-check-double ms-2"></i></button>
                </div>

                <!-- Step 3: New Password -->
                <div id="stepPassword" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="newPassInput" class="form-control" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="confirmPassInput" class="form-control" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="button" onclick="resetPassword()" class="btn-auth mb-4 shadow">UPDATE PASSWORD <i class="fa-solid fa-circle-check ms-2"></i></button>
                </div>

                <div id="alertBox" class="alert d-none small py-2 text-center mb-4 rounded-4 border-0 shadow-sm"></div>

                <div class="auth-footer text-center small mt-4 pt-4 border-top">
                    <a th:href="@{/student-login}" class="text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let currentOtp = "";

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.className = `alert alert-${type} small py-2 text-center mb-4`;
        }

        async function requestOtp() {
            const email = document.getElementById('emailInput').value;
            if(!email) return showAlert("Please enter your email.", "danger");

            const res = await fetch(`/api/auth/request-otp?email=${email}`, { method: 'POST' });
            const data = await res.text();

            if (data === "OTP_SENT") {
                currentEmail = email;
                document.getElementById('stepEmail').style.display = 'none';
                document.getElementById('stepOtp').style.display = 'block';
                document.getElementById('stepDescription').innerText = "Step 2: Enter the verification code sent to your email.";
                showAlert("OTP has been sent successfully!", "success");
            } else {
                showAlert("Email not found in our records.", "danger");
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otpInput').value;
            if(!otp) return showAlert("Please enter the OTP.", "danger");

            const res = await fetch(`/api/auth/verify-otp?email=${currentEmail}&otp=${otp}`, { method: 'POST' });
            const data = await res.text();

            if (data === "OTP_VERIFIED") {
                currentOtp = otp;
                document.getElementById('stepOtp').style.display = 'none';
                document.getElementById('stepPassword').style.display = 'block';
                document.getElementById('stepDescription').innerText = "Step 3: Create your new secure password.";
                showAlert("OTP Verified! Set your new password.", "success");
            } else {
                showAlert("Invalid or expired OTP. Please try again.", "danger");
            }
        }

        async function resetPassword() {
            const newPass = document.getElementById('newPassInput').value;
            const confirmPass = document.getElementById('confirmPassInput').value;

            if(!newPass || newPass !== confirmPass) {
                return showAlert("Passwords do not match or are empty.", "danger");
            }

            const res = await fetch(`/api/auth/reset-password?email=${currentEmail}&otp=${currentOtp}&newPassword=${newPass}`, { method: 'POST' });
            const data = await res.text();

            if (data === "SUCCESS") {
                showAlert("Password updated successfully! Redirecting to login...", "success");
                setTimeout(() => window.location.href = "/?login=true", 2000);
            } else {
                showAlert("Failed to update password. Session may have expired.", "danger");
            }
        }
    </script>
</body>
</html>
